name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Validate release tag
        run: node --import tsx scripts/release.ts validate
      - name: Build and verify the npm archive
        run: npm run pack:verify
      - name: Publish to npm with OIDC
        run: node --import tsx scripts/release.ts npm
      - name: Publish GitHub Release
        run: node --import tsx scripts/release.ts github
        env:
          GH_TOKEN: ${{ github.token }}
